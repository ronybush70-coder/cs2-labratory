<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>CS2 LABRATORY</title>
<style>
:root{--bg:#000;--text:#f3f4f6;--muted:#8b8b8b;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #1a1a1a}
.top-inner{max-width:1280px;margin:0 auto;padding:8px 10px 0}
.refreshbar{background:#1a0505;color:#fecaca;border-bottom:1px solid #7f1d1d;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;padding:6px 8px}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.brand h1{margin:0;font-size:15px;letter-spacing:.12em}
.pulse{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:800;text-transform:uppercase;box-shadow:0 0 10px #ef4444;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px #ff2b2b}}
@keyframes spin{to{transform:rotate(360deg)}}
.slipbtn{background:#111;color:#fff;border:1px solid #3b82f6;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer}
.searchbox{display:flex;background:#0c0c0c;border:1px solid #222;border-radius:8px;padding:0 6px;margin-bottom:6px}
.searchbox input{flex:1;background:transparent;border:0;color:#fff;font-size:16px;padding:8px 6px;outline:0}
.searchbox button{background:#3b82f6;color:#fff;border:0;border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px}
.maintabs,.chips{display:flex;gap:0;overflow-x:auto}
.mtab,.chip{flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:#8b8b8b;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mtab.on,.chip.on{color:#fff;border-bottom-color:#3b82f6}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 40px}
.bookbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.bookbubble select{background:#0c0c0c;color:#fff;border:1px solid #2a2a2a;border-radius:999px;padding:7px 12px;font-weight:700}
.note{color:#8b8b8b;font-size:12px}
.panel{border:1px solid #1a1a1a;overflow:auto;background:#000}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#0a0a0a;color:#8b8b8b;font-size:10px;text-transform:uppercase;padding:6px 5px;text-align:left}
td{padding:6px 5px;border-bottom:1px solid #141414;vertical-align:middle}
.play{font-weight:700;max-width:140px}.muted{color:#8b8b8b;font-size:11px}
.A{color:#22c55e;font-weight:800}.B{color:#86efac;font-weight:800}.C{color:#eab308;font-weight:800}.D,.F{color:#ef4444;font-weight:800}
.btn{background:#1f1f1f;color:#fff;border:1px solid #2a2a2a;border-radius:6px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer}
.btn.sim{color:#86efac;border-color:#14532d}
.act{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.act .ml{color:#86efac;font-size:11px;font-weight:800}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:30;padding:20px 10px;overflow:auto}
.overlay.show{display:block}
.modal-inner{max-width:860px;margin:0 auto;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0}
.stat{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.stat b{display:block}.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mapcard{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.mapcard.likely{border-color:#22c55e}
.kv{width:100%;margin:10px 0}
.kv th{width:42%;color:#8b8b8b;font-size:11px;text-transform:uppercase;text-align:left;padding:6px 4px;background:transparent;position:static}
.kv td{padding:6px 4px;font-weight:700}
.page{display:none}.page.on{display:block}
.bump.up{display:inline-block;margin-left:4px;background:#7f1d1d;color:#fecaca;border-radius:999px;padding:1px 6px;font-size:9px;font-weight:800}
@media(max-width:820px){
  body{overflow-x:hidden}
  .top-inner,.wrap{padding:6px 8px;max-width:100%}
  .panel{margin:0;border:0;overflow:visible}
  #boardPanel table,#boardPanel thead,#boardPanel tbody,#boardPanel tr,#boardPanel th,#boardPanel td{display:block;width:100%}
  #boardPanel thead{display:none}
  #boardPanel tr{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;margin:0 0 8px;padding:8px}
  #boardPanel td{border:0;padding:2px 0;width:100%}
  #boardPanel td:nth-child(1),td:nth-child(6),td:nth-child(7),td:nth-child(11){display:none}
  #boardPanel td:nth-child(2){display:inline-block;width:auto;font-size:18px;margin-right:8px}
  #boardPanel td:nth-child(3){display:block;width:100%}
  #boardPanel td:nth-child(4)::before{content:"Line "}
  #boardPanel td:nth-child(5)::before{content:"L5 "}
  #boardPanel td:nth-child(8)::before{content:"Avg "}
  #boardPanel td:nth-child(9)::before{content:"H2H "}
  #boardPanel td:nth-child(10)::before{content:"Proj "}
  #boardPanel td:nth-child(4),td:nth-child(5),td:nth-child(8),td:nth-child(9),td:nth-child(10){display:inline-block;width:32%;font-size:12px;color:#d1d5db}
  #boardPanel td:nth-child(4)::before,td:nth-child(5)::before,td:nth-child(8)::before,td:nth-child(9)::before,td:nth-child(10)::before{content:attr(data-x);display:block;color:#8b8b8b;font-size:9px;text-transform:uppercase}
  .play{max-width:none}
  .act{flex-direction:column;align-items:stretch;white-space:normal}
  .btn{width:100%}
  .chips,.maintabs{flex-wrap:wrap}
  .bookbar{flex-wrap:wrap}
}


.lbl{display:none;font-size:9px;color:#8b8b8b;text-transform:uppercase}
body.view-col .lbl,body.view-grid .lbl{display:block}
@media(max-width:820px){body:not(.view-row) .lbl{display:block}}
body.view-grid #boardPanel tbody{display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.view-col #boardPanel table,body.view-col #boardPanel thead,body.view-col #boardPanel tbody,body.view-col #boardPanel tr,body.view-col #boardPanel th,body.view-col #boardPanel td{display:block;width:100%}
body.view-col #boardPanel thead{display:none}
body.view-col #boardPanel tr{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;margin:0 0 6px;padding:6px}
</style></head>
<body>
<div class="refreshbar" id="refreshbar">LAST REFRESHED — Sep 17, 2026 9:15 PM CT</div>
<div class="top"><div class="top-inner">
  <div class="brand">
    <h1>CS2 LABRATORY</h1>
    <span class="pulse">updated every hour 2–11pm CT</span>
    <button class="slipbtn" id="slipOpen">Generate slip</button>
  </div>
  <div class="maintabs">
    <button class="mtab on" data-view="props">Props</button>
    <button class="mtab" data-view="due">Due</button>
    <button class="mtab" data-view="maps">Maps</button>
  </div>
  <form class="searchbox" id="form"><input id="q" placeholder="Search player or prop"/><button>Grade</button></form>
  <div class="chips" id="chips"></div>
</div></div>
<div class="wrap">
  <div id="home" class="page on">
    <div class="bookbar">
      <div class="bookbubble"><select id="book"><option value="">All books</option><option>PP</option><option>UD</option><option>Sleeper</option><option>betr</option></select></div>
      <div class="bookbubble"><select id="statSort"><option value="rank">Rank</option><option value="l5">L5</option><option value="avg">Avg</option><option value="h2h">H2H</option></select></div>
      <div class="bookbubble"><select id="viewMode"><option value="row">Row</option><option value="col">Col</option><option value="grid">Grid</option></select></div>
      <span class="note" id="status">Loading…</span>
    </div>
    <div class="panel" id="boardPanel"><table><thead><tr><th>#</th><th>Player</th><th>Prop</th><th>Line</th><th>L5</th><th>L10</th><th>Streak</th><th>Avg</th><th>H2H</th><th>Proj</th><th>Books</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="mapsPanel" style="display:none" class="panel"><div id="mapsOut" class="mapgrid"></div></div>
  </div>
  <div id="slipPage" class="page">
    <a href="#" id="backHome">← Back</a>
    <h2>Generate slip</h2>
    <label>Legs <input id="legs" type="number" value="3" min="2" max="6"/></label>
    <label>Book <select id="slipBook"><option>PP</option><option>UD</option><option>Sleeper</option><option>betr</option></select></label>
    <button id="genBtn">Build</button>
    <div id="slipOut"></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal-inner" id="modal"></div></div>
<script src="data.js"></script>
<script>
if(typeof ALL==="undefined") ALL=window.ALL||[];
if(typeof REFRESH==="undefined") REFRESH=window.REFRESH||"";
const VIEW={mode:"props"};
function blob(p){return (p.player+" "+p.prop+" "+p.match+" "+p.team+" "+p.opp).toLowerCase()}
function bookOk(p){const b=document.getElementById("book").value; if(!b) return true; return (p.books||"").split("/").includes(b)}
function rankScore(p){let s=(p.l5||0)*1.2+(p.l10||0)+(p.h2h||0)*0.5+(p.avg||0)*0.3; if(p.miss) s+=8; if(p.ml>50) s+=5; if(p.grade==="A") s+=15; if(p.grade==="B") s+=8; return s}
function dueScore(p){return (p.miss?20:0)+(100-(p.l5||50))}
function isDue(p){return p.miss || (p.l5||0)<40}
function project(p){const mu=(p.avg||p.line||0); const noise=Math.max(1.5, mu*0.12); const n=Math.round(mu+ (Math.random()-0.4)*noise*0.6); const vs=n-(p.line||0); const pOver=Math.min(92,Math.max(8,50+vs*12)); return {n,vs,pOver,mu:Math.round(mu*10)/10}}
function sortByStat(arr){const k=document.getElementById("statSort").value; if(k==="rank") return arr.slice().sort((a,b)=>rankScore(b)-rankScore(a)); if(k==="l5") return arr.slice().sort((a,b)=>(b.l5||0)-(a.l5||0)); if(k==="avg") return arr.slice().sort((a,b)=>(b.avg||0)-(a.avg||0)); if(k==="h2h") return arr.slice().sort((a,b)=>(b.h2h||0)-(a.h2h||0)); return arr}
function render(rows){const tb=document.getElementById("rows"); tb.innerHTML=""; rows.forEach((p,i)=>{const pr=project(p); const tr=document.createElement("tr"); tr.innerHTML=`<td>${i+1}</td><td class="play">${p.player}<div class="muted">${p.team} vs ${p.opp}</div></td><td>${p.prop}</td><td data-x="Line">${p.line}</td><td data-x="L5">${p.l5||"—"}%</td><td>${p.l10||"—"}%</td><td>${p.streak||"—"}</td><td data-x="Avg">${p.avg||"—"}</td><td data-x="H2H">${p.h2h||"—"}%</td><td data-x="Proj">${pr.n}</td><td class="muted">${p.books||""}</td><td class="act"><button class="btn" data-act="sum" data-i="${i}">Sum</button><button class="btn sim" data-act="sim" data-i="${i}">Sim</button><span class="ml">ML ${p.ml||"—"}%</span></td>`; tb.appendChild(tr)});}
function openSummary(i){const p=ALL.filter(bookOk)[i]; if(!p) return; const pr=project(p); document.getElementById("overlay").className="overlay show"; document.getElementById("modal").innerHTML=`<h2>${p.player} · ${p.prop} ${p.line}</h2><div class="grid"><div class="stat"><b>${p.l5||"—"}%</b>L5</div><div class="stat"><b>${p.l10||"—"}%</b>L10</div><div class="stat"><b>${p.avg||"—"}</b>Avg</div><div class="stat"><b>${p.h2h||"—"}%</b>H2H</div><div class="stat"><b>${pr.n}</b>Proj</div><div class="stat"><b>${p.ml||"—"}%</b>ML</div></div><table class="kv"><tr><th>Match</th><td>${p.match}</td></tr><tr><th>Last</th><td>${p.last||"—"}</td></tr><tr><th>Miss last</th><td>${p.miss?"YES":"no"}</td></tr><tr><th>Grade</th><td class="${p.grade||"C"}">${p.grade||"C"}</td></tr><tr><th>Books</th><td>${p.books||"—"}</td></tr><tr><th>Pool</th><td>${(p.pool||[]).join(", ")||"—"}</td></tr></table><button id="x">Close</button>`; document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";}
function openSim(i){const p=ALL.filter(bookOk)[i]; if(!p) return; document.getElementById("overlay").className="overlay show"; document.getElementById("modal").innerHTML=`<h2>Simulating ${p.player}…</h2><p class="muted">Running map averages + noise…</p>`; setTimeout(()=>{const r=project(p); const hit=r.n>p.line?"OVER":r.n<p.line?"UNDER":"PUSH"; document.getElementById("modal").innerHTML=`<h2>${p.player} · ${p.prop} ${p.line}</h2><div class="${hit==="OVER"?"A":hit==="UNDER"?"F":"C"}">${hit} vs ${p.line}</div><p class="muted">Whole-number finish from map averages + noise. Map mean ${r.mu}.</p><button id="x">Close</button>`; document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";},5000);}
document.getElementById("rows").addEventListener("click",e=>{const b=e.target.closest(".btn"); if(!b) return; if(b.dataset.act==="sim") openSim(+b.dataset.i); else openSummary(+b.dataset.i);});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay") e.target.className="overlay"});
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();search(document.getElementById("q").value)});
document.getElementById("q").addEventListener("input",e=>search(e.target.value));
document.getElementById("book").addEventListener("change",()=>search(document.getElementById("q").value));
document.getElementById("statSort").addEventListener("change",()=>search(document.getElementById("q").value));
document.getElementById("viewMode").addEventListener("change",e=>{document.body.classList.remove("view-col","view-grid","view-row"); document.body.classList.add("view-"+e.target.value);});
document.body.classList.add("view-row");
["All","Maps 1-2 Kills","Maps 1-2 HS","Discrepancies","Due","Unders"].forEach(c=>{const b=document.createElement("button"); b.type="button"; b.className="chip"+(c==="All"?" on":""); b.textContent=c; b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); b.classList.add("on"); document.getElementById("q").value=c==="All"?"":c; search(c);}; document.getElementById("chips").appendChild(b);});
document.querySelectorAll(".mtab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".mtab").forEach(x=>x.classList.remove("on")); t.classList.add("on"); VIEW.mode=t.dataset.view; const mapsOn=VIEW.mode==="maps"; document.getElementById("mapsPanel").style.display=mapsOn?"block":"none"; document.getElementById("boardPanel").style.display=mapsOn?"none":"block"; if(VIEW.mode==="due") document.getElementById("q").value="Due"; search(document.getElementById("q").value);});
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on")); document.getElementById(id).classList.add("on")}
document.getElementById("slipOpen").onclick=()=>showPage("slipPage");
document.getElementById("backHome").onclick=e=>{e.preventDefault();showPage("home")};
document.getElementById("genBtn").onclick=()=>{const n=+document.getElementById("legs").value, book=document.getElementById("slipBook").value; const pool=ALL.filter(p=>(p.books||"").split("/").includes(book)).map(p=>({p,pr:project(p)})).filter(x=>(x.pr.pOver||0)>=55).sort((a,b)=>b.pr.pOver-a.pr.pOver); const used=new Set(), pick=[]; for(const x of pool){ if(pick.length>=n) break; if(used.has(x.p.player)) continue; pick.push(x); used.add(x.p.player); } document.getElementById("slipOut").innerHTML=pick.map((x,i)=>`<p><b>${i+1}. ${x.p.player}</b> ${x.p.prop} ${x.p.line} · P(over) ${x.pr.pOver}%</p>`).join("")||"Not enough legs on that book.";};
function search(q){q=(q||"").trim(); const status=document.getElementById("status"); if(!q||q==="All"){ status.textContent="Live PickFinder board"+" · "+ALL.length+" PickFinder lines · refreshed "+REFRESH; render(sortByStat(ALL.filter(bookOk))); return; } if(q==="Due"){ const hits=ALL.filter(bookOk).filter(isDue).sort((a,b)=>dueScore(b)-dueScore(a)); status.textContent=hits.length+" due / miss"; render(hits); return; } if(q==="Unders"){ const hits=ALL.filter(bookOk).map(p=>({p,pr:project(p)})).filter(x=>x.pr.n!=null&&x.pr.vs<=-1.2).sort((a,b)=>a.pr.vs-b.pr.vs).map(x=>x.p); status.textContent=hits.length+" unders"; render(hits); return; } if(q==="Discrepancies"){ const hits=ALL.filter(bookOk).map(p=>({p,pr:project(p)})).filter(x=>x.pr.n!=null&&x.pr.vs>0).sort((a,b)=>b.pr.vs-a.pr.vs).map(x=>x.p); status.textContent=hits.length+" discrepancies"; render(hits); return; } const cat=["Maps 1-2 Kills","Maps 1-2 HS"].includes(q)?q:null; const hits=(cat?ALL.filter(p=>p.prop===cat):ALL.filter(p=>blob(p).includes(q.toLowerCase()))).filter(bookOk); status.textContent=hits.length+" matches"; render(sortByStat(hits)); }
search("");
</script></body></html>
