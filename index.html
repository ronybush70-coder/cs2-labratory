<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>CS2 LABRATORY</title>
<style>
:root{--bg:#000;--text:#f3f4f6;--muted:#8b8b8b;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #1a1a1a}
.top-inner{max-width:1280px;margin:0 auto;padding:8px 10px 0}
.refreshbar{background:#1a0505;color:#fecaca;border-bottom:1px solid #7f1d1d;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;padding:6px 8px}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.brand h1{margin:0;font-size:15px;letter-spacing:.12em}
.pulse{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:800;text-transform:uppercase;box-shadow:0 0 10px #ef4444;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px #ff2b2b}}
@keyframes spin{to{transform:rotate(360deg)}}
.slipbtn{background:#111;color:#fff;border:1px solid #3b82f6;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer}
.searchbox{display:flex;background:#0c0c0c;border:1px solid #222;border-radius:8px;padding:0 6px;margin-bottom:6px}
.searchbox input{flex:1;background:transparent;border:0;color:#fff;font-size:16px;padding:8px 6px;outline:0}
.searchbox button{background:#3b82f6;color:#fff;border:0;border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px}
.maintabs,.chips{display:flex;gap:0;overflow-x:auto}
.mtab,.chip{flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:#8b8b8b;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mtab.on,.chip.on{color:#fff;border-bottom-color:#3b82f6}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 40px}
.bookbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.bookbubble select{background:#0c0c0c;color:#fff;border:1px solid #2a2a2a;border-radius:999px;padding:7px 12px;font-weight:700}
.note{color:#8b8b8b;font-size:12px}
.panel{border:1px solid #1a1a1a;overflow:auto;background:#000}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#0a0a0a;color:#8b8b8b;font-size:10px;text-transform:uppercase;padding:6px 5px;text-align:left}
td{padding:6px 5px;border-bottom:1px solid #141414;vertical-align:middle}
.play{font-weight:700;max-width:140px}.muted{color:#8b8b8b;font-size:11px}
.A{color:#22c55e;font-weight:800}.B{color:#86efac;font-weight:800}.C{color:#eab308;font-weight:800}.D,.F{color:#ef4444;font-weight:800}
.btn{background:#1f1f1f;color:#fff;border:1px solid #2a2a2a;border-radius:6px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer}
.btn.sim{color:#86efac;border-color:#14532d}
.act{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.act .ml{color:#86efac;font-size:11px;font-weight:800}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:30;padding:20px 10px;overflow:auto}
.overlay.show{display:block}
.modal-inner{max-width:860px;margin:0 auto;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0}
.stat{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.stat b{display:block}.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mapcard{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.mapcard.likely{border-color:#22c55e}
.kv{width:100%;margin:10px 0}
.kv th{width:42%;color:#8b8b8b;font-size:11px;text-transform:uppercase;text-align:left;padding:6px 4px;background:transparent;position:static}
.kv td{padding:6px 4px;font-weight:700}
.page{display:none}.page.on{display:block}
.bump.up{display:inline-block;margin-left:4px;background:#7f1d1d;color:#fecaca;border-radius:999px;padding:1px 6px;font-size:9px;font-weight:800}
@media(max-width:820px){
  body{overflow-x:hidden}
  .top-inner,.wrap{padding:6px 8px;max-width:100%}
  .panel{margin:0;border:0;overflow:visible}
  #boardPanel table,#boardPanel thead,#boardPanel tbody,#boardPanel tr,#boardPanel th,#boardPanel td{display:block;width:100%}
  #boardPanel thead{display:none}
  #boardPanel tr{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;margin:0 0 8px;padding:8px}
  #boardPanel td{border:0;padding:2px 0;width:100%}
  #boardPanel td:nth-child(1),td:nth-child(6),td:nth-child(7),td:nth-child(11){display:none}
  #boardPanel td:nth-child(2){display:inline-block;width:auto;font-size:18px;margin-right:8px}
  #boardPanel td:nth-child(3){display:block;width:100%}
  #boardPanel td:nth-child(4)::before{content:"Line "}
  #boardPanel td:nth-child(5)::before{content:"L5 "}
  #boardPanel td:nth-child(8)::before{content:"Avg "}
  #boardPanel td:nth-child(9)::before{content:"H2H "}
  #boardPanel td:nth-child(10)::before{content:"Proj "}
  #boardPanel td:nth-child(4),td:nth-child(5),td:nth-child(8),td:nth-child(9),td:nth-child(10){display:inline-block;width:32%;font-size:12px;color:#d1d5db}
  #boardPanel td:nth-child(4)::before,td:nth-child(5)::before,td:nth-child(8)::before,td:nth-child(9)::before,td:nth-child(10)::before{content:attr(data-x);display:block;color:#8b8b8b;font-size:9px;text-transform:uppercase}
  .play{max-width:none}
  .act{flex-direction:column;align-items:stretch;white-space:normal}
  .btn{width:100%}
  .chips,.maintabs{flex-wrap:wrap}
  .bookbar{flex-wrap:wrap}
}
.lbl{display:none;font-size:9px;color:#8b8b8b;text-transform:uppercase}
body.view-col .lbl,body.view-grid .lbl{display:block}
@media(max-width:820px){body:not(.view-row) .lbl{display:block}}
body.view-grid #boardPanel tbody{display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.view-col #boardPanel table,body.view-col #boardPanel thead,body.view-col #boardPanel tbody,body.view-col #boardPanel tr,body.view-col #boardPanel th,body.view-col #boardPanel td{display:block;width:100%}
body.view-col #boardPanel thead{display:none}
body.view-col #boardPanel tr{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;margin:0 0 6px;padding:6px}
</style></head>
<body>
<div class="refreshbar" id="refreshbar">LAST REFRESHED — Sep 17, 2026 8:08 PM CT</div>
<div class="top"><div class="top-inner">
  <div class="brand">
    <h1>CS2 LABRATORY</h1>
    <span class="pulse">updated every hour 2–11pm CT</span>
  </div>
  <div class="maintabs">
    <button class="mtab on" data-view="props">Props</button>
    <button class="mtab" data-view="due">Due</button>
    <button class="mtab" data-view="maps">Maps</button>
  </div>
  <form class="searchbox" id="form"><input id="q" placeholder="Search player or prop"/><button>Grade</button></form>
  <div class="chips" id="chips"></div>
</div></div>
<div class="page on" id="home">
<div class="wrap">
  <div class="bookbar">
    <span class="note">Sportsbook</span>
    <label class="bookbubble"><select id="book">
      <option value="">All books</option>
      <option value="PP">PrizePicks</option>
      <option value="UD">Underdog</option>
      <option value="Sleeper">Sleeper</option>
      <option value="bovada">Bovada</option>
      <option value="betr">Betr</option>
      <option value="Chalkboard">Chalkboard</option>
    </select></label>
    <span class="note">Filter</span>
    <label class="bookbubble"><select id="statSort">
      <option value="">STATS</option>
      <option value="l5">Last 5</option>
      <option value="l10">Last 10</option>
      <option value="h2h">H2H</option>
    </select></label>
    <span class="note">View</span>
    <label class="bookbubble"><select id="viewMode">
      <option value="row">Row</option>
      <option value="col">Column</option>
      <option value="grid">Grid</option>
    </select></label>
  </div>
  <p class="note" id="status"></p>
  <div class="panel" id="boardPanel"><table>
    <thead><tr><th>#</th><th>Grade</th><th>Player</th><th>Line</th><th>Last 5</th><th>Last 10</th><th>Last 15</th><th>Avg</th><th>H2H</th><th>Proj</th><th>Books</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="panel" id="mapsPanel" style="display:none"><table>
    <thead><tr><th>Match</th><th>Map 1</th><th>Map 2</th><th>Top projected</th><th>Start</th></tr></thead>
    <tbody id="mapRows"></tbody>
  </table></div>
</div></div>
<div class="page" id="slipPage">
  <div class="wrap">
    <p class="note"><a href="#" id="backHome" style="color:#93c5fd">← Back</a></p>
    <div class="modal-inner">
      <h2>GENERATE SLIP</h2>
      <div class="bookbar">
        <select id="legs"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
        <select id="slipBook">
          <option value="PP">PrizePicks (max 6)</option>
          <option value="UD">Underdog (max 8)</option>
          <option value="Sleeper">Sleeper (max 8)</option>
        </select>
        <button class="btn" id="genBtn" style="background:#1d4ed8">Generate</button>
      </div>
      <div id="slipOut"></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal-inner" id="modal"></div></div>
<script src="data.js"></script>
<script>
const VIEW={mode:"props"};
function bookOf(){return (document.getElementById("book")||{}).value||""}
function bookOk(p){const b=bookOf(); if(!b) return true; return (p.books||"").split("/").some(x=>x.trim().toLowerCase()===b.toLowerCase())}
function statKey(){return (document.getElementById("statSort")||{}).value||""}
function sortByStat(list){
  const k=statKey(); const arr=list.slice();
  if(!k) return arr.sort((a,b)=>rankScore(b)-rankScore(a));
  return arr.sort((a,b)=>{
    const av=k==="h2h"?((a.h2hGames||0)>0?a.h2h:-1):(a[k]==null?-1:a[k]);
    const bv=k==="h2h"?((b.h2hGames||0)>0?b.h2h:-1):(b[k]==null?-1:b[k]);
    return bv-av;
  });
}
function blob(p){return [p.player,p.team,p.opp,p.match,p.prop,p.line,p.books,p.grade].join(" ").toLowerCase()}
function isHS(p){return /hs|head/i.test(p.prop)}
function metricKey(p){return isHS(p)?"hs":"k"}
function fmtStart(s){if(!s)return ""; const d=new Date(s); if(isNaN(d))return s; return d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"})+" CT"}
function mapExpect(p){
  const ms=MAPS[p.player]||{};
  const pool=(p.pool||[]).filter(m=>ms[m]);
  let names=pool.length?pool:Object.keys(ms).sort((a,b)=>ms[b].n-ms[a].n).slice(0,3);
  const key=metricKey(p); const vals=names.map(m=>ms[m]&&ms[m][key]).filter(v=>v!=null);
  if(!vals.length) return {val:null,how:"no map sample",names};
  if(p.maps12 && vals.length>=2) return {val:+(vals[0]+vals[1]).toFixed(1),how:names.slice(0,2).join(" + "),names};
  return {val:+vals[0].toFixed(1),how:names[0],names};
}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const PC={};
function project(p){
  const id=p.player+"|"+p.prop+"|"+p.line+"|"+p.match;
  if(PC[id]) return PC[id];
  const m=mapExpect(p); let mu=m.val;
  if(mu==null){const o={n:null,pOver:null,p10:null,p90:null,vs:null,why:"No sample",lean:"—"};PC[id]=o;return o}
  const nMaps=p.maps12?2:1; const per=nMaps===2?mu/2:mu;
  const sd=Math.max(isHS(p)?2.2:3.2, per*0.28);
  const mul=p.ml>=70?0.94:p.ml>=55?0.98:p.ml<=40?1.06:1;
  const N=2000, totals=[];
  const maps=(m.names||[]).slice(0,nMaps);
  for(let t=0;t<N;t++){
    let tot=0;
    for(let k=0;k<nMaps;k++){
      const name=maps[k]; let x=per;
      if(name&&MAPS[p.player]&&MAPS[p.player][name]) x=MAPS[p.player][name][metricKey(p)];
      tot+=Math.max(0,(x*mul)+sd*gauss());
    }
    totals.push(tot);
  }
  totals.sort((a,b)=>a-b);
  const median=+totals[N/2|0].toFixed(1);
  const p10=+totals[(N*0.1)|0].toFixed(1);
  const p90=+totals[(N*0.9)|0].toFixed(1);
  const pOver=+(100*totals.filter(x=>x>p.line).length/N).toFixed(1);
  const vs=+(median-p.line).toFixed(1);
  const lean=pOver>=60?"OVER":pOver<=40?"UNDER":"TOSSUP";
  const o={n:median,pOver,p10,p90,vs,lean,why:"MC "+N+" · maps "+(maps.join(" + ")||"L10")+" · median "+median+" vs "+p.line+" · P(over) "+pOver+"%"};
  PC[id]=o; return o;
}
function factorScores(p){
  const pr=project(p);
  const parts=[];
  parts.push(Math.max(0,Math.min(100,p.ml||0)));
  parts.push(pr.n==null?null:Math.max(0,Math.min(100,50+(pr.n-p.line)*12.5)));
  parts.push((p.h2hGames||0)>0?Math.max(0,Math.min(100,p.h2h)):null);
  parts.push(p.l5==null?null:Math.max(0,Math.min(100,p.l5)));
  parts.push(p.l10==null?null:Math.max(0,Math.min(100,p.l10)));
  parts.push(p.l15==null?null:Math.max(0,Math.min(100,p.l15)));
  const used=parts.filter(v=>v!=null);
  const avg=used.length?+(used.reduce((a,b)=>a+b,0)/used.length).toFixed(1):0;
  let grade="F";
  if(avg>=72) grade="A";
  else if(avg>=62) grade="B";
  else if(avg>=52) grade="C";
  else if(avg>=42) grade="D";
  p.grade=grade; p.score=avg;
  return avg;
}
function rankScore(p){
  const avg=factorScores(p);
  const g="ABCDF".indexOf(p.grade);
  return (4-g)*1000 + avg;
}
function featured(){
  return ALL.slice().sort((a,b)=>rankScore(b)-rankScore(a)).slice(0,100);
}
let CURRENT=[];
function bumpBadge(p){
  const k=[p.player,p.prop,p.match].join("|");
  const b=BUMPS[k];
  if(!b) return "";
  if(b.new>b.old) return `<span class="bump up">BUMPED ${b.old}→${b.new}</span>`;
  return `<span class="bump up" style="background:#14532d;color:#bbf7d0;border-color:#22c55e">CUT ${b.old}→${b.new}</span>`;
}
function render(list){
  CURRENT=list;
  document.getElementById("rows").innerHTML=list.map((p,i)=>{
    const pr=project(p);
    return `<tr>
      <td>${i+1}</td><td class="${p.grade}">${p.grade}</td>
      <td class="play">${p.player}<div class="muted">${p.match} · ${p.prop}</div></td>
      <td><div class="lbl">Line</div>${p.line}</td>
      <td><div class="lbl">Last 5</div>${p.l5==null?"n/a":p.l5+"%"}</td>
      <td><div class="lbl">Last 10</div>${p.l10==null?"n/a":p.l10+"%"}</td>
      <td><div class="lbl">Last 15</div>${p.l15==null?"n/a":p.l15+"%"}</td>
      <td><div class="lbl">Avg</div>${p.avg??"n/a"}</td>
      <td><div class="lbl">H2H</div>${p.h2hGames?p.h2h+"%":"n/a"}</td>
      <td><div class="lbl">Proj</div><b>${pr.n??"n/a"}</b></td>
      <td>${p.books||"—"}</td>
      <td><div class="act">
        <button class="btn" data-act="sum" data-i="${i}">Summary</button>
        <button class="btn sim" data-act="sim" data-i="${i}">Simulation</button>
        <span class="muted">${p.team} vs ${p.opp}</span>
        <span class="muted">${fmtStart(p.start)}</span>
        <span class="ml">${p.ml}% win</span>
      </div></td></tr>`;
  }).join("")||`<tr><td colspan="11" class="muted">No rows</td></tr>`;
}
function renderMaps(){
  const by={};
  ALL.filter(bookOk).forEach(p=>{
    const k=p.match||"?";
    if(!by[k]) by[k]={match:k,start:p.start,team:p.team,opp:p.opp,pool:p.pool||[],players:[]};
    by[k].players.push(p);
    (p.pool||[]).forEach(m=>{if(!by[k].pool.includes(m)) by[k].pool.push(m)});
  });
  const rows=Object.values(by).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  document.getElementById("mapRows").innerHTML=rows.map(m=>{
    const m1=m.pool[0]||"TBD", m2=m.pool[1]||"TBD";
    const tops=m.players.map(p=>({p,pr:project(p)})).sort((a,b)=>(b.pr.pOver||0)-(a.pr.pOver||0)).slice(0,3)
      .map(x=>x.p.player+" "+x.p.prop+" ("+(x.pr.pOver??"—")+"%)").join(" · ");
    return `<tr><td class="play">${m.match}</td><td>${m1}</td><td>${m2}</td><td class="muted">${tops||"—"}</td><td>${fmtStart(m.start)}</td></tr>`;
  }).join("");
}
function isDue(p){
  const pr=project(p);
  const over=pr.pOver!=null && pr.pOver>=55;
  if(!p.miss || !over) return false;
  const h2hOk=(p.h2hGames||0)>0 && (p.h2h||0)>=50;
  const favNoH2H=(p.h2hGames||0)===0 && (p.ml||0)>50;
  return h2hOk || favNoH2H;
}
function dueScore(p){ return rankScore(p); }
function dueList(){
  return ALL.filter(bookOk).filter(isDue).sort((a,b)=>dueScore(b)-dueScore(a));
}
function search(q){
  q=(q||"").trim();
  const status=document.getElementById("status");
  if(VIEW.mode==="maps"){status.textContent="Maps: HLTV veto/H2H when posted (VIT-FURIA Nuke/Cache, NRG-AUR Cache/Inferno, MOUZ-NAVI Cache/Dust2). Others = last H2H pool until HLTV posts a veto.";renderMaps();return;}
  if(VIEW.mode==="due" || q.toLowerCase()==="due"){
    const hits=dueList();
    status.textContent=hits.length+" due · missed last · H2H≥50% or (no H2H + favorite) · P(over)≥55% · ranked by team ML, P(over), H2H";
    render(sortByStat(hits)); return;
  }
  if(!q||q.toLowerCase()==="all"){
    const list=featured().filter(bookOk);
    status.textContent="Live PickFinder board"+" · "+ALL.length+" PickFinder lines · refreshed "+REFRESH;
    render(sortByStat(ALL.filter(bookOk)));
    return;
  }
  if(q.toLowerCase()==="discrepancies"){
    const hits=ALL.filter(bookOk).map(p=>({p,pr:project(p)})).filter(x=>x.pr.n!=null&&x.pr.vs>0).sort((a,b)=>b.pr.vs-a.pr.vs).map(x=>x.p);
    status.textContent=hits.length+" discrepancies"; render(sortByStat(hits)); return;
  }
  if(q.toLowerCase()==="unders"){
    const hits=ALL.filter(bookOk).map(p=>({p,pr:project(p)})).filter(x=>x.pr.n!=null&&x.pr.vs<=-1.2).sort((a,b)=>a.pr.vs-b.pr.vs).map(x=>x.p);
    status.textContent=hits.length+" unders"; render(sortByStat(hits)); return;
  }
  const CATS=["Maps 1-2 Kills","Maps 1-2 HS","Map 1 Kills","Map 1 HS","Map 2 Kills"];
  const cat=CATS.find(c=>c.toLowerCase()===q.toLowerCase());
  const hits=(cat?ALL.filter(p=>p.prop===cat):ALL.filter(p=>blob(p).includes(q.toLowerCase()))).filter(bookOk)
    .sort((a,b)=>rankScore(b)-rankScore(a));
  status.textContent=hits.length+" lines"; render(sortByStat(hits));
}
function mapCards(p){
  const ms=MAPS[p.player]||{}, likely=new Set(p.pool||[]);
  const names=Object.keys(ms).sort((a,b)=>(likely.has(b)-likely.has(a))||ms[b].n-ms[a].n);
  const key=metricKey(p), lab=isHS(p)?"avg HS":"avg kills";
  return '<div class="mapgrid">'+names.map(m=>{const x=ms[m];return `<div class="mapcard ${likely.has(m)?"likely":""}"><b>${m}</b><br>${lab} ${x[key]} · rtg ${x.r} · ${x.n} maps</div>`}).join("")+"</div>";
}
function statsTable(p,pr){
  const m=mapExpect(p);
  const rows=[
    ["Grade",p.grade],["Line",p.line],["Projected line (top 2 maps)",pr.n??"n/a"],
    ["Team ML",p.ml+"%"],["Last 5",p.l5==null?"n/a":p.l5+"%"],["Last 10",p.l10==null?"n/a":p.l10+"%"],
    ["Last 15",p.l15==null?"n/a":p.l15+"%"],["L10 avg",p.avg??"n/a"],
    ["H2H",(p.h2hGames||0)?p.h2h+"% ("+p.h2hHits+"/"+p.h2hGames+")":"n/a"],
    ["Last match",p.last],["Books",p.books||"—"],["Likely maps",(p.pool||[]).slice(0,2).join(" + ")||"n/a"]
  ];
  return `<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</tbody></table>`;
}
function openSummary(i){
  const p=CURRENT[i], pr=project(p);
  document.getElementById("overlay").className="overlay show";
  document.getElementById("modal").innerHTML=`<button class="btn" id="x">Close</button>
    <div class="${p.grade}" style="font-size:42px">${p.grade}</div>
    <div><b>${p.player}</b> ${p.prop} ${p.line}<div class="muted">${p.match}</div></div>
    ${statsTable(p,pr)}${mapCards(p)}`;
  document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";
}
function runSim1000(p){
  const m=mapExpect(p);
  const names=(m.names||[]).slice(0,2);
  const key=metricKey(p);
  const ms=MAPS[p.player]||{};
  const mu=names.reduce((a,n)=>a+((ms[n]&&ms[n][key])||0),0) || m.val || p.avg || p.line;
  const per=names.length?mu/Math.max(1,names.length):mu;
  const sd=Math.max(isHS(p)?2:3, per*0.28);
  let tot=0;
  for(let i=0;i<1000;i++){
    let s=0;
    for(let k=0;k<Math.max(1,names.length||2);k++){
      const nm=names[k]; let x=per;
      if(nm&&ms[nm]) x=ms[nm][key];
      s+=Math.max(0,x+sd*gauss());
    }
    tot+=s;
  }
  return {val:Math.round(tot/1000), maps:names.join(" + ")||"top maps", mu:+(+mu).toFixed(1)};
}
function openSim(i){
  const p=CURRENT[i];
  document.getElementById("overlay").className="overlay show";
  document.getElementById("modal").innerHTML=`<button class="btn" id="x">Close</button>
    <div><b>${p.player}</b> simulation</div>
    <div class="muted">${p.prop} line ${p.line}</div>
    <div id="spin" style="margin:28px auto;width:56px;height:56px;border:4px solid #222;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <p class="muted" id="spinmsg">Running 1,000 sims on the top maps…</p>`;
  document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";
  setTimeout(()=>{
    const r=runSim1000(p);
    const hit=r.val>p.line?"OVER":r.val<p.line?"UNDER":"PUSH";
    document.getElementById("modal").innerHTML=`<button class="btn" id="x">Close</button>
      <div><b>${p.player}</b> simulation</div>
      <div class="muted">1,000 trials · ${r.maps||"top maps"}</div>
      <div style="font-size:56px;font-weight:800;margin:12px 0">${r.val}</div>
      <div class="${hit==="OVER"?"A":hit==="UNDER"?"F":"C"}">${hit} vs ${p.line}</div>
      <p class="muted">Whole-number finish from map averages + noise. Map mean ${r.mu}.</p>`;
    document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";
  },5000);
}

  const n=+document.getElementById("legs").value, book=document.getElementById("slipBook").value;
  const pool=ALL.filter(p=>(p.books||"").split("/").includes(book)).map(p=>({p,pr:project(p)})).filter(x=>(x.pr.pOver||0)>=55)
    .sort((a,b)=>b.pr.pOver-a.pr.pOver);
  const used=new Set(), pick=[];
  for(const x of pool){ if(pick.length>=n) break; if(used.has(x.p.player)) continue; pick.push(x); used.add(x.p.player); }
  document.getElementById("slipOut").innerHTML=pick.map((x,i)=>`<p><b>${i+1}. ${x.p.player}</b> ${x.p.prop} ${x.p.line} · P(over) ${x.pr.pOver}%</p>`).join("")||"Not enough legs on that book.";
};
