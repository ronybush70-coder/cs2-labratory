<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>CS2 LABRATORY</title>
<style>
:root{--bg:#000;--text:#f3f4f6;--muted:#8b8b8b;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #1a1a1a}
.top-inner{max-width:1280px;margin:0 auto;padding:8px 10px 0}
.refreshbar{background:#1a0505;color:#fecaca;border-bottom:1px solid #7f1d1d;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;padding:6px 8px}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.brand h1{margin:0;font-size:15px;letter-spacing:.12em}
.pulse{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:800;text-transform:uppercase;box-shadow:0 0 10px #ef4444;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px #ff2b2b}}
@keyframes spin{to{transform:rotate(360deg)}}
.slipbtn{background:#111;color:#fff;border:1px solid #3b82f6;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer}
.searchbox{display:flex;background:#0c0c0c;border:1px solid #222;border-radius:8px;padding:0 6px;margin-bottom:6px}
.searchbox input{flex:1;background:transparent;border:0;color:#fff;font-size:16px;padding:8px 6px;outline:0}
.searchbox button{background:#3b82f6;color:#fff;border:0;border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px}
.maintabs,.chips{display:flex;gap:0;overflow-x:auto}
.mtab,.chip{flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:#8b8b8b;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mtab.on,.chip.on{color:#fff;border-bottom-color:#3b82f6}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 40px}
.bookbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.bookbubble select{background:#0c0c0c;color:#fff;border:1px solid #2a2a2a;border-radius:999px;padding:7px 12px;font-weight:700}
.note{color:#8b8b8b;font-size:12px}
.panel{border:1px solid #1a1a1a;overflow:auto;background:#000}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#0a0a0a;color:#8b8b8b;font-size:10px;text-transform:uppercase;padding:6px 5px;text-align:left}
td{padding:6px 5px;border-bottom:1px solid #141414;vertical-align:middle}
.play{font-weight:700;max-width:140px}.muted{color:#8b8b8b;font-size:11px}
.A{color:#22c55e;font-weight:800}.B{color:#86efac;font-weight:800}.C{color:#eab308;font-weight:800}.D,.F{color:#ef4444;font-weight:800}
.btn{background:#1f1f1f;color:#fff;border:1px solid #2a2a2a;border-radius:6px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer}
.btn.sim{color:#86efac;border-color:#14532d}
.act{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.act .ml{color:#86efac;font-size:11px;font-weight:800}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:30;padding:20px 10px;overflow:auto}
.overlay.show{display:block}
.modal-inner{max-width:860px;margin:0 auto;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0}
.stat{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.stat b{display:block}.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mapcard{background:#000;border:1px solid #222;border-radius:8px;padding:8px}
.mapcard.likely{border-color:#22c55e}
.kv{width:100%;margin:10px 0}
.kv th{width:42%;color:#8b8b8b;font-size:11px;text-transform:uppercase;text-align:left;padding:6px 4px;background:transparent;position:static}
.kv td{padding:6px 4px;font-weight:700}
.page{display:none}.page.on{display:block}
.bump.up{display:inline-block;margin-left:4px;background:#7f1d1d;color:#fecaca;border-radius:999px;padding:1px 6px;font-size:9px;font-weight:800}
.panel{overflow-x:auto;-webkit-overflow-scrolling:touch}
#boardPanel table,#mapsPanel table{min-width:980px;width:100%;border-collapse:collapse}
.lbl{display:none}
@media(max-width:820px){
  .top-inner,.wrap{padding:6px 8px;max-width:100%}
  .chips,.maintabs{flex-wrap:wrap}
  .bookbar{flex-wrap:wrap}
}
</style></head>

</div></div>

    <p class="note"><a href="#" id="backHome" style="color:#93c5fd">← Back</a></p>

      <h2>GENERATE SLIP</h2>

        </select>
        <button class="btn" id="genBtn" style="background:#1d4ed8">Generate</button>
      </div>
      <div id="slipOut"></div>
    </div>
  </div>
</div>

function mapExpect(p){
  const ms=MAPS[p.player]||{};
  const four=topFourMaps(p);
  const two=topTwoMaps(p);
  const key=metricKey(p);
  const fourVals=four.map(m=>mapRate(p,m)).filter(v=>v!=null);
  if(!fourVals.length){
    if(p.avg!=null) return {val:+p.avg.toFixed(1),how:"L10 avg",names:two,four,mapAvgs:[]};
    return {val:null,how:"no map sample",names:two,four,mapAvgs:[]};
  }
  const per=fourVals.reduce((a,b)=>a+b,0)/fourVals.length;
  const val=p.maps12?+(per*2).toFixed(1):+per.toFixed(1);
  const mapAvgs=four.map(m=>{const st=ms[m]||{}; return {map:m,avg:st[key],n:st.n,pct:(pickList(p).find(x=>x.map===m)||{}).pct};});
  return {val,how:"top4 avg "+four.join("/") ,names:two,four,mapAvgs};
}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const PC={};
function project(p){
  const id=p.player+"|"+p.prop+"|"+p.line+"|"+p.match;
  if(PC[id]) return PC[id];
  const m=mapExpect(p); let mu=m.val;
  if(mu==null){const o={n:null,pOver:null,p10:null,p90:null,vs:null,why:"No sample",lean:"—"};PC[id]=o;return o}
  const maps=(m.names||[]).slice(0,2);
  const nMaps=Math.max(1, maps.length|| (p.maps12?2:1));
  const per=nMaps===2?mu/2:mu;
  const sd=Math.max(isHS(p)?1.6:2.4, per*0.18);
  const N=10000, totals=[];
  for(let t=0;t<N;t++){
    let tot=0;
    for(let k=0;k<nMaps;k++){
      const name=maps[k]; let x=per;
      if(name&&MAPS[p.player]&&MAPS[p.player][name]&&MAPS[p.player][name][metricKey(p)]!=null)
        x=MAPS[p.player][name][metricKey(p)];
      tot+=Math.max(0,x+sd*gauss());
    }
    totals.push(tot);
  }
  totals.sort((a,b)=>a-b);
  const median=+totals[N/2|0].toFixed(1);
  const p10=+totals[(N*0.1)|0].toFixed(1);
  const p90=+totals[(N*0.9)|0].toFixed(1);
  const pOver=+(100*totals.filter(x=>x>p.line).length/N).toFixed(1);
  const vs=+(median-p.line).toFixed(1);
  const lean=pOver>=60?"OVER":pOver<=40?"UNDER":"TOSSUP";
  const o={n:median,pOver,p10,p90,vs,lean,why:"MC "+N+" · maps "+(maps.join(" + ")||"L10")+" · median "+median+" vs "+p.line+" · P(over) "+pOver+"%"};
  PC[id]=o; return o;
}
function factorScores(p){
  const pr=project(p);
  const parts=[];
  parts.push(Math.max(0,Math.min(100,p.ml||0)));
  parts.push(pr.n==null?null:Math.max(0,Math.min(100,50+(pr.n-p.line)*12.5)));
  parts.push((p.h2hGames||0)>0?Math.max(0,Math.min(100,p.h2h)):null);
  parts.push(p.l5==null?null:Math.max(0,Math.min(100,p.l5)));
  parts.push(p.l10==null?null:Math.max(0,Math.min(100,p.l10)));
  parts.push(p.l15==null?null:Math.max(0,Math.min(100,p.l15)));
  const used=parts.filter(v=>v!=null);
  const avg=used.length?+(used.reduce((a,b)=>a+b,0)/used.length).toFixed(1):0;
  let grade="F";
  if(avg>=72) grade="A";
  else if(avg>=62) grade="B";
  else if(avg>=52) grade="C";
  else if(avg>=42) grade="D";
  p.grade=grade; p.score=avg;
  return avg;
}
function rankScore(p){
  const avg=factorScores(p);
  const g="ABCDF".indexOf(p.grade);
  return (4-g)*1000 + avg;
}
function featured(){
  return ALL.slice().sort((a,b)=>rankScore(b)-rankScore(a)).slice(0,100);
}
let CURRENT=[];
function bumpOf(p){
  const k=[p.player,p.prop,p.match].join("|");
  if(BUMPS[k]) return BUMPS[k];
  const parts=p.match&&p.match.split(" vs ");
  if(parts&&parts.length===2){
    const k2=[p.player,p.prop,parts[1]+" vs "+parts[0]].join("|");
    if(BUMPS[k2]) return BUMPS[k2];
  }
  return null;
}
function bumpBadge(p){
  const b=bumpOf(p);
  if(!b) return "";
  const old=b.old!=null?b.old:b.from, nw=b.new!=null?b.new:b.to;
  if(old==null||nw==null) return "";
  if(nw>old) return `<span class="bump up">BUMPED ${old}→${nw}</span>`;
  return `<span class="bump up" style="background:#14532d;color:#bbf7d0">CUT ${old}→${nw}</span>`;
}

function renderMaps(){
  const by={};
  ALL.filter(rowOk).forEach(p=>{
    const k=p.match||"?";
    if(!by[k]) by[k]={match:k,start:p.start,team:p.team,opp:p.opp,pool:p.pool||[],players:[]};
    by[k].players.push(p);
    (p.pool||[]).forEach(m=>{if(!by[k].pool.includes(m)) by[k].pool.push(m)});
  });
  const rows=Object.values(by).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  document.getElementById("mapRows").innerHTML=rows.map(m=>{
    const picks=m.players[0]&&m.players[0].picks?m.players[0].picks: (m.pool||[]).map((x,i)=>({map:x,pct:""}));
    const cells=picks.slice(0,4).map(x=>`${x.map} ${x.pct?x.pct+"%":""}`).join(" · ") || "TBD";
    const tops=m.players.map(p=>({p,pr:project(p)})).sort((a,b)=>(b.pr.pOver||0)-(a.pr.pOver||0)).slice(0,3)
      .map(x=>x.p.player+" "+x.p.prop+" ("+(x.pr.pOver??"—")+"%)").join(" · ");
    return `<tr><td class="play">${m.match}</td><td colspan="2">${cells}</td><td class="muted">${tops||"—"}</td><td>${fmtStart(m.start)}</td></tr>`;
  }).join("");
}
function missedLast(p){
  if(p.miss===true) return true;
  if((p.strk||0)<0) return true;
  const last=String(p.last||"");
  const n=parseFloat(last);
  if(!isNaN(n) && last.search(/vs/i)>=0) return n < p.line;
  return false;
}
function hasHltv(p){
  if(p.hltv) return true;
  const m=mapExpect(p);
  return (m.mapAvgs||[]).length>=2 || m.val!=null;
}
function isDue(p){
  if(!missedLast(p)) return false;
  const pr=project(p);
  if(pr.n==null || pr.vs==null || pr.vs<=0) return false;
  if(pr.pOver!=null && pr.pOver<52) return false;
  const h2hOk=(p.h2hGames||0)>0 && (p.h2h||0)>=50;
  return h2hOk && hasHltv(p);
}
function dueScore(p){
  const pr=project(p);
  const h2h=(p.h2hGames||0)>0?(p.h2h||0):0;
  const edge=(pr.vs||0)*18;
  const maps=mapExpect(p);
  const mapBonus=(maps.mapAvgs||[]).length>=2?12:0;
  const hltvBonus=p.hltv?8:0;
  return h2h + edge + (pr.pOver||0)*0.35 + mapBonus + hltvBonus;
}
function dueList(){
  return ALL.filter(rowOk).filter(isDue).sort((a,b)=>dueScore(b)-dueScore(a));
}
function discList(){
  return ALL.filter(rowOk).map(p=>({p,pr:project(p),maps:mapExpect(p)}))
    .filter(x=>x.pr.n!=null && x.pr.vs>0)
    .sort((a,b)=>{
      const ga=b.pr.vs-a.pr.vs;
      if(Math.abs(ga)>0.05) return ga;
      return (b.pr.pOver||0)-(a.pr.pOver||0);
    }).map(x=>x.p);
}
function search(q){
  q=(q||"").trim();
  const status=document.getElementById("status");
  if(VIEW.mode==="maps"){status.textContent="Maps: HLTV veto/H2H when posted (VIT-FURIA Nuke/Cache, NRG-AUR Cache/Inferno, MOUZ-NAVI Cache/Dust2). Others = last H2H pool until HLTV posts a veto.";renderMaps();return;}
  if(VIEW.mode==="due" || q.toLowerCase()==="due"){
    const hits=dueList();
    status.textContent=hits.length+" due · missed last line · H2H≥50% · HLTV maps project OVER · ranked by H2H + map-proj gap";
    render(hits); return;
  }
  if(!q||q.toLowerCase()==="all"){
    const list=featured().filter(rowOk);
    status.textContent="Live PickFinder board"+" · "+ALL.length+" PickFinder lines · refreshed "+REFRESH;
    render(sortByStat(ALL.filter(rowOk)));
    return;
  }
  if(VIEW.mode==="discrepancies" || q.toLowerCase()==="discrepancies"){
    const hits=discList();
    status.textContent=hits.length+" discrepancies · ranked by biggest (map-proj − line). Top 2 maps + L10 avg.";
    render(hits); return;
  }
  if(q.toLowerCase()==="unders"){
    const hits=ALL.filter(rowOk).map(p=>({p,pr:project(p)})).filter(x=>x.pr.n!=null&&x.pr.vs<0).sort((a,b)=>a.pr.vs-b.pr.vs).map(x=>x.p);
    status.textContent=hits.length+" unders · worst first (proj farthest under the line = will not cash the over)";
    render(hits); return;
  }
  if(q.toLowerCase()==="bumps"){
    const hits=ALL.filter(rowOk).filter(bumpOf);
    status.textContent=hits.length+" props with line movement vs last board";
    render(sortByStat(hits)); return;
  }
  const CATS=["Maps 1-2 Kills","Maps 1-2 HS","Map 1 Kills","Map 1 HS","Map 2 Kills"];
  const cat=CATS.find(c=>c.toLowerCase()===q.toLowerCase());
  const hits=(cat?ALL.filter(p=>p.prop===cat):ALL.filter(p=>blob(p).includes(q.toLowerCase()))).filter(rowOk)
    .sort((a,b)=>rankScore(b)-rankScore(a));
  status.textContent=hits.length+" lines"; render(sortByStat(hits));
}
function mapCards(p){
  const ms=MAPS[p.player]||{}, likely=new Set(p.pool||[]);
  let names=(p.pool||[]).slice(0,4);
  if(!names.some(m=>ms[m]&&ms[m].k!=null)){
    names=Object.keys(ms).filter(m=>ms[m]&&ms[m].k!=null).slice(0,4);
  }
  return '<div class="mapgrid">'+names.map(m=>{
    const x=(MAPS[p.player]||{})[m]||{};
    const ok=(x.n||0)>=1 && x.k!=null;
    const kk=ok&&x.k!=null?x.k:"NA";
    const hh=ok&&x.hs!=null?x.hs:"NA";
    const rr=ok&&x.r!=null?x.r:"NA";
    return `<div class="mapcard likely"><b>${m}</b><br>kills ${kk} · HS ${hh}<br>rating ${rr}<br>${ok?"HLTV · "+x.n+" maps":"NA"}</div>`;
  }).join("")+"</div>";
}
function statsTable(p,pr){
  const m=mapExpect(p);
  const rows=[
    ["Grade",p.grade],["Line",p.line],["Projected line (top 4 maps)",pr.n??"n/a"],
    ["PF ML",(p.ml!=null?p.ml+"%":"n/a")+(p.mlAm!=null?" · "+p.mlAm:"")+(p.mlBk?" · "+p.mlBk:"")],["HLTV ML",p.hltvMl!=null?p.hltvMl+"%":"n/a"],["Last 5",p.l5==null?"n/a":p.l5+"%"],["Last 10",p.l10==null?"n/a":p.l10+"%"],
    ["Last 15",p.l15==null?"n/a":p.l15+"%"],["L10 avg",p.avg??"n/a"],
    ["H2H",(p.h2hGames||0)?p.h2h+"% ("+p.h2hHits+"/"+p.h2hGames+")":"n/a"],
    ["Last match",p.last],["Books",p.books||"—"],["Top 4 map picks",(p.picks||[]).map(x=>x.map+" "+x.pct+"%").join(" · ")||(p.pool||[]).join(" + ")||"n/a"],["Sim maps (top 2)",topTwoMaps(p).join(" + ")||"n/a"]
  ];
  return `<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</tbody></table>`;
}

function cashWriteup(p,pr){
  const m=mapExpect(p);
  const maps=(m.how||"the likely maps");
  const bits=[];
  if(pr.n!=null) bits.push(p.player+" projects "+pr.n+" on "+p.prop+" vs the "+p.line+" line ("+(pr.vs>0?"+"+pr.vs:"")+ " vs line) using "+maps+".");
  if((p.h2hGames||0)>0) bits.push("H2H is "+p.h2h+"% ("+p.h2hHits+"/"+p.h2hGames+") against "+(p.opp||"this opponent")+".");
  else bits.push("No H2H sample vs "+(p.opp||"this opponent")+".");
  if(p.l5!=null) bits.push("Last 5 hit rate "+p.l5+"%, last 10 "+(p.l10??"n/a")+"%, last 15 "+(p.l15??"n/a")+"%, L10 avg "+(p.avg??"n/a")+".");
  if(p.miss || (p.strk||0)<0) bits.push("Missed the last look (streak "+p.strk+"), so this is a bounce spot if the map book holds.");
  else if((p.strk||0)>=3) bits.push("On a "+p.strk+"-game over streak — form is already clearing this number.");
  bits.push("Team implied win "+p.ml+"%. "+(p.last?("Last series: "+p.last+"."):""));
  const lean=pr.n==null?"Not enough map sample to force a lean.": (pr.vs>=1.5?"This cashes if they put up their map averages across the first two maps.": pr.vs<=-1.5?"The posted line is ahead of the map book — lean under unless they smash the average.":"Coin-flip vs the number; need a clean two-map script.");
  bits.push(lean);
  return bits.join(" ");
}

function runSim1000(p){
  const m=mapExpect(p);
  const names=(m.names||[]).slice(0,2);
  const key=metricKey(p);
  const ms=MAPS[p.player]||{};
  const parts=names.map(n=>(ms[n]&&ms[n][key]!=null)?ms[n][key]:null).filter(v=>v!=null);
  const mu=parts.length?parts.reduce((a,b)=>a+b,0):(m.val!=null?m.val:p.avg||p.line);
  const nMaps=Math.max(parts.length||2,1);
  const per=mu/nMaps;
  const sd=Math.max(isHS(p)?1.6:2.4, per*0.18);
  let tot=0;
  for(let i=0;i<10000;i++){
    let s=0;
    for(let k=0;k<nMaps;k++){
      const x=parts[k]!=null?parts[k]:per;
      s+=Math.max(0,x+sd*gauss());
    }
    tot+=s;
  }
  return {val:Math.round(tot/10000), maps:names.join(" + ")||m.how||"top maps", mu:+(+mu).toFixed(1)};
}
function openSim(i){
  const p=CURRENT[i];
  document.getElementById("overlay").className="overlay show";
  document.getElementById("modal").innerHTML=`<button class="btn" id="x">Close</button>
    <div><b>${p.player}</b> simulation</div>
    <div class="muted">${p.prop} line ${p.line}</div>
    <div id="spin" style="margin:28px auto;width:56px;height:56px;border:4px solid #222;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <p class="muted" id="spinmsg">Running 10,000 sims on the top maps…</p>`;
  document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";
  setTimeout(()=>{
    const r=runSim1000(p);
    const hit=r.val>p.line?"OVER":r.val<p.line?"UNDER":"PUSH";
    document.getElementById("modal").innerHTML=`<button class="btn" id="x">Close</button>
      <div><b>${p.player}</b> simulation</div>

    document.getElementById("x").onclick=()=>document.getElementById("overlay").className="overlay";
  },5000);
}
